server {
    listen 80;
    server_name _;

    # 全站 HTTPS —— 80 全部跳 443。
    # 注意点:
    #   1. 用 301 而不是 302:浏览器会记住跳转,避免每次都过本服务器。
    #   2. 用 $host 而不是 $server_name:$server_name 在 _ 写法下会是空,
    #      $host 是实际请求头里的 Host,更稳。
    #   3. 保留 acme.sh 的 HTTP-01 验证路径 /.well-known/acme-challenge/
    #      不被跳转 —— 否则续签 Let's Encrypt 时会被自己的 301 拦下。
    #      但本项目证书来自外部 A 服务器,这里其实不需要;留作安全冗余。
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (abc.jokelx.xyz)
#
# 注意:这是静态文件直接出 —— 不像原 default.conf 那样通过 include
# /etc/nginx/api-locations/*.conf 反代到 47.110.80.47:8988。
#
# 因为:
#   1. 443 入口必须与 80 走同一份 API 路由表(否则 /api/v1/* 在 https
#      下 404,https 跳转过来后所有接口全挂)。
#   2. 所以这里也 include 同一份 generated.conf,与 server {listen 80;}
#      共享路由。
#
# 关键点:gen-nginx-locations 插件只生成 location 块,不带 proxy_pass
# 之外的 server 级别声明;80 和 443 两个 server{} 都可以 include 同一份
# location,不会有冲突。
server {
    listen 443 ssl;
    http2 on;
    server_name abc.jokelx.xyz;

    ssl_certificate     /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTPS 下也复用 80 的 API 反代 + 静态资源 + SPA fallback。
    # 完整 copy 自原 80 server,唯一区别是 listen / ssl_* 头部声明。
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # HTTPS 下 CSP 不需要 http:;同时去掉 'unsafe-inline' 风险来源,
    # 但 ve 当前的运行依赖 inline style(script 标签),这里保留兼容。
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    include /etc/nginx/api-locations/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}