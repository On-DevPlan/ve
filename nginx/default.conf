server {
    listen 80;
    server_name _;

    # 全站 HTTPS —— 80 全部跳 443。
    # 注意点:
    #   1. 用 301 而不是 302:浏览器会记住跳转,避免每次都过本服务器。
    #   2. 用 $host 而不是 $server_name:$server_name 在 _ 写法下会是空,
    #      $host 是实际请求头里的 Host,更稳。
    #   3. 保留 acme.sh 的 HTTP-01 验证路径 /.well-known/acme-challenge/
    #      不被跳转 —— 否则续签 Let's Encrypt 时会被自己的 301 拦下。
    #      但本项目证书来自外部 A 服务器,这里其实不需要;留作安全冗余。
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (abc.jokelx.xyz)
#
# 注意:这是静态文件直接出 —— 不像原 default.conf 那样通过 include
# /etc/nginx/api-locations/*.conf 反代到 47.110.80.47:8988。
#
# 因为:
#   1. 443 入口必须与 80 走同一份 API 路由表(否则 /api/v1/* 在 https
#      下 404,https 跳转过来后所有接口全挂)。
#   2. 所以这里也 include 同一份 generated.conf,与 server {listen 80;}
#      共享路由。
#
# 关键点:gen-nginx-locations 插件只生成 location 块,不带 proxy_pass
# 之外的 server 级别声明;80 和 443 两个 server{} 都可以 include 同一份
# location,不会有冲突。
server {
    listen 443 ssl;
    http2 on;
    server_name abc.jokelx.xyz;

    ssl_certificate     /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTPS 下也复用 80 的 API 反代 + 静态资源 + SPA fallback。
    # 完整 copy 自原 80 server,唯一区别是 listen / ssl_* 头部声明。
    root /usr/share/nginx/html;
    index index.html;

    # 文件上传相关超时(2026-08-16 配合分片上传调整):
    #   - client_max_body_size 1024m:旧直传路径仍可能走 100MB+ 单发,
    #     chunked 路径(>10MB)本身不需要这么大的 body,放宽无害
    #   - client_body_timeout 600s:nginx 读客户端 body 超时
    #   - proxy_send_timeout 600s:nginx → 上游 Go 转发 body 超时
    #   - proxy_read_timeout 600s:等上游响应 —— 关键!chunked complete
    #     步骤服务端 concat + 流式双 hash + dedup + thumbnails 对 GB 文件
    #     要 10-30s;默认 60s 大文件必炸
    # Go 上游 (dev_ctr_hello) 的 http.Server.ReadTimeout / WriteTimeout
    # 也要同步放宽,否则 nginx 看着是超时,根因在 Go 自己的 ReadTimeout。
    client_max_body_size 1024m;
    client_body_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # HTTPS 下 CSP 不需要 http:;同时去掉 'unsafe-inline' 风险来源,
    # 但 ve 当前的运行依赖 inline style(script 标签),这里保留兼容。
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后端文件直链反代。/files/<fileId> 是后端文件服务路径(非 API,不走
    # registry / gen-nginx)。前端 resolveFileUrl 把后端返回的绝对 url
    # (https://47.110.80.47:8988/files/...)剥成同源相对路径 /files/...,
    # 这里反代到后端 8988,浏览器永远同源请求 —— 避免 mixed-content 与
    # 跨端口 TLS 问题。
    #
    # ^~ 必须加:上面的 `location ~* \.(js|css|png...)$` 是正则,nginx 优先级
    # 正则 > 普通前缀,会把 /files/abc.png 当静态资源命中 → try_files → 404。
    # ^~ 让本块赢过正则。
    # 不发 X-Forwarded-Proto:文件服务直接吐二进制,不拼 url(不像 /api/v1
    # 那样后端按 proto 拼 url 字段)。
    location ^~ /files/ {
        proxy_pass http://47.110.80.47:8988;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    include /etc/nginx/api-locations/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}