version: '3.8'

services:
  # 主应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: three_vue:latest
    container_name: three_vue_app
    ports:
      - "8001:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VERSION=${VERSION:-latest}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


networks:
  app-network:
    driver: bridge