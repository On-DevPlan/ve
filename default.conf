server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 组件声明的后端 API 代理。
    #
    # 这些 location 由 apps/showcase/src/api/gen-nginx.ts 从
    # apps/showcase/src/api/registry.ts 单一事实源生成,与 dev 侧的
    # apps/showcase/src/api/to-vite-proxy.ts (apiGateway) 共用 normalize,
    # 所以不会出现"本地能跑、上线 404"。不要手改生成的文件。
    #
    # 用通配符 include:没有任何后端声明时目录为空,nginx 依然能启动
    # (固定路径 include 一个不存在的文件会直接 fail)。
    #
    # 必须放在 `location /` 之前(可读性;nginx 本身按优先级而非顺序匹配),
    # 且生成的是 `location ^~` —— 否则会被下面的静态资源正则抢走。
    include /etc/nginx/api-locations/*.conf;

    # Vue Router history模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}