name: lint

# 只在 PR 上跑:合并前的最终闸门,而不是"推到默认分支后才报错"。
# 不带 branches 限定 → 所有目标分支(main / deploy)的 PR 都触发,避免漏分支。
# 不监听 push:提交前由本地 pre-commit hook 兜底,merge 流程由 PR 保证。
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉取 base ref 才能 diff 出来本 PR 变更的文件。
          # 默认 fetch-depth=1 只拿 HEAD commit,git diff 看不到 base。
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 关键改动:只 lint 本 PR 改动/新增的文件,不再扫整个 monorepo。
      # 原因:
      #   - main 上有遗留 lint 错误(PinMode.vue / useDesktopStore.ts 等),
      #     全量 lint 必失败,挡住一切 PR
      #   - 这些错误属技术债,跟当前 PR 无关,不该卡合并
      #   - PR diff 范围内的 eslint 是真正应该把关的"新增/修改代码质量"
      # 这里用 `git diff --name-only --diff-filter=ACMR ${{ github.base_ref }}`
      #   - --diff-filter=ACMR:Added/Copied/Modified/Renamed(跳过 Deleted 的文件)
      #   - 限定到 .ts/.tsx/.vue/.js/.jsx 后缀(避免无意义的二进制/config 文件)
      - name: Lint changed files only
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.base_ref }}..HEAD" \
            | grep -E '\.(ts|tsx|vue|js|jsx|mjs|cjs)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No JS/TS/Vue files changed — skipping eslint"
            exit 0
          fi
          echo "Linting:"
          echo "$CHANGED" | sed 's/^/  /'
          # xargs 把多行文件列表转成命令行参数
          echo "$CHANGED" | xargs pnpm exec eslint --max-warnings=0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test