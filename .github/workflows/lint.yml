name: lint

# 只在 PR 上跑:合并前的最终闸门,而不是"推到默认分支后才报错"。
# 不带 branches 限定 → 所有目标分支(main / deploy)的 PR 都触发,避免漏分支。
# 不监听 push:提交前由本地 pre-commit hook 兜底,merge 流程由 PR 保证。
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 用 `pnpm lint`(定义在 package.json 里,等价于
      # `eslint . --max-warnings=0 --format=json --output-file=eslint-report.json`)。
      # 输出写到文件而非 stdout,这样:
      #   - 控制台只打规则聚合表(lint-summary.mjs 渲染),
      #     不再像默认格式那样把每条错误都 dump 出来;
      #   - 后续 step 能读到结构化 JSON,生成 PR 评论。
      # 用 set +e 包住是为了拿到 exit code(否则 pnpm lint 失败会
      # 让 bash 提前退出,echo "exit=$?" 跑不到);最后再用 exit
      # 把 ESLint 的退出码透传出去 —— 这是必须的:否则即使 lint
      # 失败,step 也以 0 退出,job 不会被标记成 ❌,lint 就不再是
      # merge gate 了。失败时后面两个 if: always() 仍然会跑,
      # 因为 if: always() 忽略前置 step 状态。
      - name: Run ESLint
        id: eslint
        run: |
          set +e
          pnpm lint
          ESLINT_EXIT=$?
          echo "exit=$ESLINT_EXIT" >> "$GITHUB_OUTPUT"
          exit $ESLINT_EXIT
      # 把规则聚合打到控制台 —— 不论 ESLint 成功失败都跑。
      # 与之前直接用默认格式相比,console 失去"具体文件路径 + 行号",
      # 但 PR 评论里会附带 top 5 错误(含路径),开发定位够用。
      - name: Print lint summary
        if: always()
        run: |
          if [ -s eslint-report.json ]; then
            cat eslint-report.json | node scripts/lint-summary.mjs
          else
            echo "lint summary — no eslint-report.json (ESLint did not produce one)"
          fi
      # 发 PR 评论 —— 成功 / 失败都发。
      # if: always() 是关键:失败时不希望整个 workflow 短路,
      # 因为 CI 自带的 ❌ check 已经够明示,这个 step 只是补结构化摘要。
      # sticky 化(同 PR 复用一条评论)留作未来可选 —— 当前实现是"每次
      # run 一条新评论",保留每次 push 的独立审计轨迹。
      - name: Post lint summary as PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/lint-summary-comment.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 上传 showcase build 产物给 test job —— 每个 job 是独立 runner,
      # `needs: build` 仅控制执行顺序,不共享文件系统,必须走 artifact。
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-dist
          path: apps/showcase/dist
          if-no-files-found: error
          retention-days: 1

  test:
    # 依赖 build 先跑完 —— e2e-perf.test.ts 需要 dist/component-manifest.json,
    # 由 vite build 产出。test / build / lint 默认并行,test 经常在 build 写完之前就跑了。
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 拉回 build 写的 dist,放到 test job 期望的位置
      - uses: actions/download-artifact@v4
        with:
          name: showcase-dist
          path: apps/showcase/dist
      - run: pnpm test
