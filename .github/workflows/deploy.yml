name: Deploy

on:
  push:
    branches: [ main, deploy ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t ve:latest .

    - name: Save Docker image
      run: |
        docker save ve:latest | gzip > app.tar.gz

    # 仅打印 secret 长度,避免在日志里泄漏实际内容。
    - name: Diagnose secrets (length only)
      if: always()
      env:
        HOST_LEN:                  ${{ secrets.HOST }}
        USERNAME_LEN:              ${{ secrets.USERNAME }}
        SSH_KEY_LEN:               ${{ secrets.SSH_KEY }}
        PORT_LEN:                  ${{ secrets.PORT || '22' }}
        FULLCHAIN_B64_LEN:        ${{ secrets.FULLCHAIN_B64 }}
        PRIVKEY_B64_LEN:          ${{ secrets.PRIVKEY_B64 }}
      run: |
        echo "HOST length:               ${#HOST_LEN}"
        echo "USERNAME length:           ${#USERNAME_LEN}"
        echo "SSH_KEY length:            ${#SSH_KEY_LEN}"
        echo "PORT length:               ${#PORT_LEN}"
        echo "FULLCHAIN_B64 length:      ${#FULLCHAIN_B64_LEN}"
        echo "PRIVKEY_B64 length:        ${#PRIVKEY_B64_LEN}"

    - name: Copy files to server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || '22' }}
        source: "app.tar.gz"
        target: "~/app/"
        strip_components: 0

    - name: Deploy using Docker
      uses: appleboy/ssh-action@v1
      # step-level env: 把 secret export 到 runner 进程的环境变量。
      # 这是 ssh-action 把变量传给远端 shell 的前置条件 —— with.envs
      # 只是"列名字",真正把值交给 ssh-action 进程靠这里。
      env:
        FULLCHAIN_B64: ${{ secrets.FULLCHAIN_B64 }}
        PRIVKEY_B64:   ${{ secrets.PRIVKEY_B64 }}
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || '22' }}
        timeout: 30s
        command_timeout: 10m
        # with.envs 列出要 export 到远端 shell 的变量名(逗号分隔)。
        # 变量值来自上面的 step-level env:。
        envs: FULLCHAIN_B64,PRIVKEY_B64
        script: |
          bash -c '
          set -euo pipefail

          APP_DIR="$HOME/app"
          CONTAINER_NAME="ve_app"
          IMAGE_NAME="ve"
          PORT_HTTP=80
          PORT_HTTPS=443

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          # --- 加载镜像 ---
          echo "Loading Docker image..."
          docker load < app.tar.gz
          rm app.tar.gz

          # --- 清理旧容器 ---
          echo "Stopping old container..."
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm   "$CONTAINER_NAME" 2>/dev/null || true

          # --- 决定是否传 TLS env ---
          # secrets.FULLCHAIN_B64 / PRIVKEY_B64 在 GH Actions 里默认空字符串。
          # 空 base64 串会让 entrypoint 走到 "HTTPS DISABLED" 分支,容器仍能起;
          # 不传 / 传合法 base64 都会让 entrypoint 落盘 + 自检证书。
          TLS_ARGS=""
          if [ -n "${FULLCHAIN_B64:-}" ] && [ -n "${PRIVKEY_B64:-}" ]; then
            echo "TLS secrets present → enabling HTTPS"
            TLS_ARGS="-e FULLCHAIN_B64 -e PRIVKEY_B64"
          else
            echo "TLS secrets missing → running HTTP only on :80"
          fi

          # --- 启动新容器 ---
          # 注意:-p 80:80 + -p 443:443 必须同时给,且宿主机安全组放通
          # 443(后者在阿里云控制台 / 等价物里手动配,这一步做不到)。
          echo "Starting new container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$PORT_HTTP":80 \
            -p "$PORT_HTTPS":443 \
            -e NODE_ENV=production \
            $TLS_ARGS \
            "$IMAGE_NAME:latest"

          # --- 等待服务启动 ---
          echo "Waiting for service to start..."
          sleep 15

          echo "Container status:"
          docker ps | grep "$CONTAINER_NAME" || true

          # --- 健康检查 ---
          # 优先级:HTTPS → HTTP 80 → fail。
          # HTTPS 失败不一定是配置错 —— 也可能是证书还没粘到 secrets
          # 或没续期 —— 这种情况下 HTTP 80 应该能工作,所以 fallback。
          echo "Performing health check (HTTPS first)..."
          for i in 1 2 3 4 5 6; do
            # -k 容忍自签 / SAN 不全(本地调试用)。生产 Let's Encrypt
            # 证书不会被 -k 触发,仅当 cert 真的不合法时报警。
            if curl -fk -o /dev/null "https://localhost:$PORT_HTTPS/health"; then
              echo "✅ Deployment successful (HTTPS)!"
              echo "🌐 https://abc.jokelx.xyz is live"
              exit 0
            fi
            echo "HTTPS health check attempt $i/6 failed, retrying in 10s..."
            sleep 10
          done

          echo "⚠️  HTTPS not available, falling back to HTTP :80..."
          for i in 1 2 3; do
            if curl -f "http://localhost:$PORT_HTTP/health"; then
              echo "✅ Deployment successful (HTTP only)!"
              echo "🌐 http://abc.jokelx.xyz is live (HTTPS pending — check TLS secrets)"
              exit 0
            fi
            sleep 5
          done

          # --- 全失败:贴日志方便诊断 ---
          echo "❌ Health check failed after all attempts!"
          echo "--- container logs ---"
          docker logs "$CONTAINER_NAME" || true
          echo "--- nginx config test ---"
          docker exec "$CONTAINER_NAME" nginx -t 2>&1 || true
          exit 1
          '