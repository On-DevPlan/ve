name: Deploy

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      version:
        description: 'Version to deploy (format: v1.0.0)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          # 手动触发时使用输入的版本
          VERSION="${{ github.event.inputs.version }}"
        else
          # 自动触发时使用commit hash作为版本
          VERSION=$(git rev-parse --short HEAD)
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true  # 加载到本地环境
        tags: three_vue:${{ steps.get_version.outputs.version }}

    - name: Save Docker image
      run: |
        docker save three_vue:${{ steps.get_version.outputs.version }} | gzip > app.tar.gz

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        source: "app.tar.gz,docker-compose.yml"
        target: "~/app/"
        strip_components: 0

    - name: Deploy using Docker Compose
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        timeout: 30s
        command_timeout: 10m
        script: |
          # 使用bash执行脚本
          bash -c '
          # 设置变量
          VERSION="${{ steps.get_version.outputs.version }}"
          APP_DIR="$HOME/app"
          IMAGE_NAME="three_vue"

          # 检测Docker Compose命令
          if command -v docker-compose &> /dev/null; then
            COMPOSE_CMD="docker-compose"
          elif docker compose version &> /dev/null; then
            COMPOSE_CMD="docker compose"
          else
            echo "Error: Neither docker-compose nor docker compose is available"
            exit 1
          fi

          echo "Using Docker Compose command: $COMPOSE_CMD"

          # 创建应用目录
          mkdir -p $APP_DIR
          cd $APP_DIR

          # 加载Docker镜像
          echo "Loading Docker image..."
          docker load < app.tar.gz

          # 清理压缩文件
          rm app.tar.gz

          # 设置环境变量
          export VERSION=$VERSION

          # 停止旧服务
          echo "Stopping old services..."
          $COMPOSE_CMD down || true

          # 重新标记镜像为latest
          echo "Tagging image as latest..."
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest || true

          # 启动新服务
          echo "Starting new services with version: $VERSION"
          VERSION=$VERSION $COMPOSE_CMD up -d

          # 等待服务启动
          echo "Waiting for service to start..."
          sleep 15

          # 显示服务状态
          echo "Service status:"
          $COMPOSE_CMD ps

          # 健康检查
          echo "Performing health check..."
          for i in {1..6}; do
            if curl -f http://localhost:8001/health; then
              echo "✅ Deployment successful! Version: $VERSION"
              echo "🌐 Application is running at: http://your-server-ip:8001"
              exit 0
            fi
            echo "Health check attempt $i/6 failed, retrying in 10s..."
            sleep 10
          done

          # 如果所有健康检查都失败，显示日志并退出
          echo "❌ Health check failed after 6 attempts!"
          $COMPOSE_CMD logs app
          exit 1
          '

  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
    - name: Rollback deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          # 使用bash执行脚本
          bash -c '
          # 设置变量
          APP_DIR="$HOME/app"
          PORT=8001

          # 检测Docker Compose命令
          if command -v docker-compose &> /dev/null; then
            COMPOSE_CMD="docker-compose"
          elif docker compose version &> /dev/null; then
            COMPOSE_CMD="docker compose"
          else
            echo "Error: Neither docker-compose nor docker compose is available"
            exit 1
          fi

          echo "Rolling back deployment using: $COMPOSE_CMD"
          cd $APP_DIR

          # 尝试重启服务
          echo "Restarting services..."
          $COMPOSE_CMD restart || {
            echo "No services found, attempting to start..."
            $COMPOSE_CMD up -d
          }

          # 等待服务启动
          sleep 15

          # 显示服务状态
          echo "Service status after rollback:"
          $COMPOSE_CMD ps

          # 检查状态
          echo "Performing health check after rollback..."
          for i in {1..3}; do
            if curl -f http://localhost:${PORT}/health; then
              echo "✅ Rollback successful!"
              echo "🌐 Application is running at: http://your-server-ip:${PORT}"
              exit 0
            fi
            echo "Health check attempt $i/3 failed, retrying in 10s..."
            sleep 10
          done

          # 如果健康检查失败，显示日志
          echo "❌ Rollback failed after 3 attempts!"
          $COMPOSE_CMD logs app
          exit 1
          '